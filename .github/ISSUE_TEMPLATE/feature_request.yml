name: Feature Request
description: Propose something new for the system or the demo.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a hackathon: prioritize what can be demonstrated in the demo over
        what looks pretty under the hood. Read `CHALLENGE.md` before proposing.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The gap that exists today, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would build and how it fits into what already exists.
    validations:
      required: true

  - type: dropdown
    id: criteria
    attributes:
      label: Challenge evaluation criterion reinforced
      description: See `CHALLENGE.md` → *Evaluation*.
      multiple: true
      options:
        - Decision (decides without complete data)
        - Priority (knows what comes first)
        - Adaptation (replanning when the situation changes)
        - Coordination (people, information, and resources simultaneously)
        - Execution (acts outside the system, not just proposing)
        - Control (actions are visible and can be intervened)
        - Creativity
        - Cross-execution learning (bonus)
    validations:
      required: true

  - type: textarea
    id: modules
    attributes:
      label: Affected modules
      description: Which files in `lib/`, `app/`, or `tests/` need to be modified, and who owns them (see `// PROPIETARIO:` header).

  - type: textarea
    id: demo
    attributes:
      label: How it is shown in the demo
      description: What the jury would see on screen. If it cannot be demonstrated, it probably should not be done right now.
