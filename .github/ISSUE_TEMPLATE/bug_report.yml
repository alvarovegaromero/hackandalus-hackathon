name: Bug Report
description: Something is not working as expected in the command center.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report: verify you are on the correct branch and
        that you have restarted `npm run dev` (state lives in memory and is lost
        when the server restarts).

  - type: textarea
    id: what-happens
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
      placeholder: |
        When approving an action, the queue leaves it in "running" and never changes.
        I expected it to transition to "succeeded" in mock mode.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Exact steps from startup, including demo buttons or API calls.
      placeholder: |
        1. `npm run dev`
        2. Click "New incident"
        3. Approve the first action in the queue
        4. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where it occurs
      options:
        - Frontend / UI (app/)
        - API Routes (app/api/)
        - Domain logic (lib/)
        - HappyRobot integration
        - Tooling / local hooks / documentation
        - I don't know
    validations:
      required: true

  - type: input
    id: mode
    attributes:
      label: Execution mode
      description: Value of `ACTION_EXECUTION_MODE`.
      placeholder: mock
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node -v` and `npm -v`, operating system, and branch.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs or error
      description: Paste the relevant stack trace. **Do not include real API keys, phone numbers, emails, or content of live interactions.**
      render: shell
